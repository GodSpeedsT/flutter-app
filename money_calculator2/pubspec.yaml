name: money_calculator2
description: Приложение для оптимизации расходов
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Навигация и состояние
  go_router: ^13.2.0
  provider: ^6.1.2

  # Локальная база данных
  sqflite: ^2.3.2
  path: ^1.9.0

  # Камера и изображения
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  permission_handler: ^11.3.0

  # HTTP запросы
  http: ^1.2.1
  dio: ^5.4.3+1

  # UI компоненты
  flutter_slidable: ^3.1.0
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1

  # Утилиты
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  uuid: ^4.3.3
  path_provider: ^2.1.3

  # Иконки и шрифты
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/